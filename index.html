<style>
/* Layout: a full-bleed surveyor's chart of the underworld; title cartouche top-left,
   controls top-right, legend bottom-left, details slide in as a ledger page (bottom sheet on phones). */
:root {
  --earth: #17120e;       /* cavern dark, the ground of the map */
  --loam: #261c15;        /* panels and bands */
  --ink: #e9dcbf;         /* parchment-ink text */
  --ink-dim: #b3a383;     /* secondary text */
  --ember: #e0782f;       /* routes and the one accent */
  --blood: #b8382b;       /* gang-raid tunnels, warnings */
  --slime: #9cc23f;       /* Scroblin green */
  --rule: #4a3a2c;        /* hairlines */
  --font-display: "Grenze Gotisch", "UnifrakturMaguntia", Georgia, serif;
  --font-body: "Alegreya", Georgia, "Times New Roman", serif;
  --font-label: "Alegreya SC", "Alegreya", Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--earth); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#app { position: relative; height: 100%; width: 100%; overflow: hidden; }
#map { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.dragging { cursor: grabbing; }

/* ---------- Title cartouche ---------- */
.cartouche {
  position: absolute; z-index: 5;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--loam) 88%, transparent);
  border: 1px solid var(--rule); border-radius: 3px;
  padding: 10px 16px 12px; max-width: min(360px, calc(100% - 140px));
  box-shadow: 0 6px 24px #0008;
}
.cartouche h1 {
  font-family: var(--font-display); font-weight: 700; margin: 0;
  font-size: clamp(26px, 4vw, 40px); line-height: 1; letter-spacing: .01em; color: var(--ink);
  text-wrap: balance;
}
.cartouche p { margin: 6px 0 0; font-size: 14px; color: var(--ink-dim); line-height: 1.35; }
.cartouche .sub { font-family: var(--font-label); letter-spacing: .08em; font-size: 12px; color: var(--ember); margin: 0 0 2px; }

/* ---------- Controls ---------- */
.controls {
  position: absolute; z-index: 5; display: flex; flex-direction: column; gap: 6px;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
}
.btn {
  font: 600 15px/1 var(--font-body); color: var(--ink);
  background: var(--loam); border: 1px solid var(--rule); border-radius: 3px;
  min-width: 42px; height: 42px; padding: 0 12px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:hover { border-color: var(--ember); }
.btn:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--ember); color: #1a0f07; border-color: var(--ember); }

/* ---------- Legend ---------- */
.legend {
  position: absolute; z-index: 4;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--loam) 88%, transparent);
  border: 1px solid var(--rule); border-radius: 3px; padding: 10px 12px;
  font-size: 13px; color: var(--ink-dim);
  display: grid; grid-template-columns: auto auto; gap: 6px 18px;
}
.legend .k { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.legend svg { flex: none; }
.legend .hint { grid-column: 1 / -1; font-style: italic; border-top: 1px solid var(--rule); padding-top: 6px; }
.legend-toggle { display: none; }

/* ---------- Detail panel (ledger page) ---------- */
.panel {
  position: absolute; z-index: 10; top: 0; right: 0; bottom: 0;
  width: min(400px, 100%);
  background: var(--loam); border-left: 1px solid var(--rule);
  box-shadow: -12px 0 40px #000a;
  transform: translateX(105%); transition: transform .28s ease;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.panel.open { transform: none; }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 20px 0; }
.panel-body { overflow-y: auto; padding: 8px 20px 24px; min-height: 0; }
.eyebrow { font-family: var(--font-label); letter-spacing: .1em; font-size: 13px; color: var(--ember); margin: 0; }
.panel h2 { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.02; margin: 4px 0 10px; text-wrap: balance; }
.panel p { line-height: 1.55; margin: 0 0 12px; max-width: 65ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
.chip { font-family: var(--font-label); font-size: 12px; letter-spacing: .06em; padding: 3px 8px; border-radius: 2px; border: 1px solid var(--rule); color: var(--ink-dim); }
.chip.done { border-color: var(--slime); color: var(--slime); }
.chip.kind { color: var(--ink); }
.cta { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; height: 46px; margin: 4px 0 18px; font-size: 16px; }
.none { font-style: italic; color: var(--ink-dim); }
.section-label { font-family: var(--font-label); letter-spacing: .08em; font-size: 13px; color: var(--ink-dim); margin: 16px 0 6px; border-bottom: 1px solid var(--rule); padding-bottom: 4px; }
.linklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.linklist button, .linklist a {
  all: unset; box-sizing: border-box; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  width: 100%; padding: 7px 8px; border-radius: 2px; color: var(--ink); line-height: 1.3;
}
.linklist button:hover, .linklist a:hover { background: #ffffff0d; }
.linklist button:focus-visible, .linklist a:focus-visible { outline: 2px solid var(--ember); }
.linklist .meta { font-size: 13px; color: var(--ink-dim); white-space: nowrap; }
.source { font-size: 13px; color: var(--ink-dim); font-style: italic; margin-top: 18px; }
.source a { color: var(--ink-dim); }

/* ---------- Mission index ---------- */
.search { width: 100%; box-sizing: border-box; height: 42px; padding: 0 12px; margin: 6px 0 4px;
  background: var(--earth); color: var(--ink); border: 1px solid var(--rule); border-radius: 3px; font: 16px var(--font-body); }
.realm-group h3 { font-family: var(--font-label); font-size: 14px; letter-spacing: .08em; color: var(--ember); margin: 16px 0 4px; font-weight: 700; }

/* ---------- SVG map styling ---------- */
.realm-shape { cursor: pointer; transition: filter .2s; }
.realm-shape:hover { filter: brightness(1.25); }
.realm-label { cursor: pointer; }
.realm-label text { font-family: var(--font-display); font-weight: 700; fill: var(--ink); }
.realm-label:hover rect { stroke: var(--ember); }
.node { cursor: pointer; }
.node text { font-family: var(--font-label); font-weight: 700; pointer-events: none; }
.node .hex { transition: transform .15s; transform-box: fill-box; transform-origin: center; }
.node:hover .hex, .node.active .hex { stroke: var(--ink); stroke-width: 5; }
.node:focus { outline: none; }
.node:focus-visible .hex { stroke: var(--ember); stroke-width: 7; }
.route { fill: none; stroke: var(--ember); stroke-width: 6; stroke-dasharray: 16 10; stroke-linecap: round; }
.route.scroblin { stroke: var(--slime); }
.passage { fill: none; stroke: var(--blood); stroke-width: 11; stroke-dasharray: 2 16; stroke-linecap: round; opacity: .9; }
.tether { fill: none; stroke: var(--ink-dim); stroke-width: 4; stroke-dasharray: 12 10; opacity: .7; }
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
/* Phones: skip the heavy SVG filters so panning and zooming stay smooth */
@media (pointer: coarse), (max-width: 640px) { #map [filter] { filter: none; } #map .grain { display: none; } }
.dim { opacity: .25; transition: opacity .2s; }

@media (max-width: 640px) {
  .cartouche p { display: none; }
  .legend { display: none; }
  .legend.show { display: grid; grid-template-columns: 1fr; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
  .legend-toggle { display: inline-flex; position: absolute; z-index: 5;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); }
  .panel { top: auto; width: 100%; max-height: 66%; border-left: 0; border-top: 1px solid var(--rule);
    transform: translateY(105%); border-radius: 10px 10px 0 0; padding-right: 0; }
  .panel-head, .panel-body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .panel h2 { font-size: 28px; }
}
</style>

<div id="app">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14"/></svg>

</div>

// seeded noise so the hand-drawn wobble is stable between visits
function rng(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

function smoothClosed(pts) {
  const n = pts.length; let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d + "Z";
}
function smoothOpen(pts) {
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  if (pts.length === 2) return d + `L${pts[1][0].toFixed(1)},${pts[1][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
function blob(cx, cy, rx, ry, seed, count = 22, wob = 0.09) {
  const rand = rng(seed), pts = [];
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2, k = 1 + (rand() - 0.5) * 2 * wob;
    pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
  }

}

  for (let px = x + w; px >= x; px -= step) bot.push([px, y + h + (rand() - 0.5) * 20]);

}

    el("path", { d: "M-5,-6 h8 l3,3 v9 h-11 z M-2,-1 h5 M-2,3 h5", fill: "none", stroke: "#e9dcbf", "stroke-width": 1.8, "stroke-linejoin": "round" }, b);
  }
  el("title", {}, g).textContent = n.name;
  nodeEls[n.id] = g;
});

// vignette (fixed over world)
el("rect", { x: WORLD.x, y: WORLD.y, width: WORLD.w, height: WORLD.h, fill: "url(#vignette)", "pointer-events": "none" }, world);

/* ---------- Legend ---------- */
const legend = document.getElementById("legend");
const swatch = (kind) => { const k = KINDS[kind];
  return `<svg width="22" height="18" viewBox="-12 -10 24 20" aria-hidden="true"><path d="M-6,-8 L6,-8 L11,0 L6,8 L-6,8 L-11,0 Z" fill="${k.fill}" stroke="${k.stroke}" stroke-width="1.5"/></svg>`; };
legend.innerHTML = [
  ["skirmish", "Mission"], ["feature", "Featured mission"], ["scroblin", "Scroblin campaign"], ["route", "Descent mission"],
].map(([k, l]) => `<span class="k">${swatch(k)}${l}</span>`).join("") +
  `<span class="k"><svg width="22" height="10" aria-hidden="true"><line x1="1" y1="5" x2="21" y2="5" stroke="#e0782f" stroke-width="3" stroke-dasharray="6 4"/></svg>Route</span>` +
  `<span class="k"><svg width="22" height="10" aria-hidden="true"><line x1="2" y1="5" x2="21" y2="5" stroke="#b8382b" stroke-width="5" stroke-dasharray="1 6" stroke-linecap="round"/></svg>Raid tunnel</span>` +
  `<span class="k"><svg width="22" height="22" viewBox="-11 -11 22 22" aria-hidden="true"><circle r="9" fill="#9cc23f" stroke="#0b0806" stroke-width="2"/><path d="M-4,0 L-1,3 L5,-4" fill="none" stroke="#0b0806" stroke-width="2.4"/></svg>Realm complete</span>` +
  `<span class="k"><svg width="22" height="22" viewBox="-11 -11 22 22" aria-hidden="true"><circle r="9" fill="#17120e" stroke="#e9dcbf" stroke-width="1.5"/><path d="M-4,-5 h6 l2,2 v7 h-8 z" fill="none" stroke="#e9dcbf" stroke-width="1.3"/></svg>Has mission brief</span>` +
  `<span class="hint">Drag to pan, scroll or pinch to zoom.</span>`;
document.getElementById("btn-legend").addEventListener("click", e => {
  const on = legend.classList.toggle("show"); e.currentTarget.setAttribute("aria-expanded", on);
});

/* =========================================================
   PAN & ZOOM
   ========================================================= */
let view = { ...WORLD };
const FOCUS = { x: -1060, y: -600, w: 3640, h: 2480 };
function apply() { svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`); }
function aspect() { const r = svg.getBoundingClientRect(); return r.width / Math.max(1, r.height); }
function fit(box = FOCUS) {
  const a = aspect(); let w = box.w, h = box.h;
  if (w / h > a) h = w / a; else w = h * a;
  view = { x: box.x + (box.w - w) / 2, y: box.y + (box.h - h) / 2, w, h }; apply();
}
function clientToWorld(cx, cy) {
  const r = svg.getBoundingClientRect();
  return { x: view.x + (cx - r.left) / r.width * view.w, y: view.y + (cy - r.top) / r.height * view.h };
}
function zoomAt(f, cx, cy) {
  const minW = 500, maxW = WORLD.w * 1.6;
  const nw = Math.min(maxW, Math.max(minW, view.w * f)); f = nw / view.w;
  const p = cx === undefined ? { x: view.x + view.w / 2, y: view.y + view.h / 2 } : clientToWorld(cx, cy);
  view = { x: p.x - (p.x - view.x) * f, y: p.y - (p.y - view.y) * f, w: view.w * f, h: view.h * f }; apply();
}
let anim = null;
function flyTo(x, y, w) {
  const a = aspect(); const h = w / a; const target = { x: x - w / 2, y: y - h / 2, w, h };
  const from = { ...view }, t0 = performance.now(), dur = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 450;
  cancelAnimationFrame(anim);
  const step = t => {
    const k = dur ? Math.min(1, (t - t0) / dur) : 1, e = 1 - Math.pow(1 - k, 3);
    for (const key in view) view[key] = from[key] + (target[key] - from[key]) * e;
    apply(); if (k < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}
svg.addEventListener("wheel", e => { e.preventDefault(); zoomAt(Math.exp(e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });

const pointers = new Map(); let dragMoved = 0, pinch = null;
svg.addEventListener("pointerdown", e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); dragMoved = 0;
  if (pointers.size === 2) { const [p1, p2] = [...pointers.values()]; pinch = { d: Math.hypot(p1.x - p2.x, p1.y - p2.y) }; }
});
svg.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId), cur = { x: e.clientX, y: e.clientY };
  pointers.set(e.pointerId, cur);
  if (pointers.size === 1) {
    const r = svg.getBoundingClientRect(), dx = cur.x - prev.x, dy = cur.y - prev.y;
    dragMoved += Math.abs(dx) + Math.abs(dy);
    if (dragMoved > 4) { svg.classList.add("dragging"); if (!svg.hasPointerCapture(e.pointerId)) svg.setPointerCapture(e.pointerId); }
    view.x -= dx / r.width * view.w; view.y -= dy / r.height * view.h; apply();
  } else if (pointers.size === 2 && pinch) {
    const [p1, p2] = [...pointers.values()], d = Math.hypot(p1.x - p2.x, p1.y - p2.y);
    zoomAt(pinch.d / d, (p1.x + p2.x) / 2, (p1.y + p2.y) / 2); pinch.d = d; dragMoved = 99;
  }
});
const endPointer = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; if (!pointers.size) svg.classList.remove("dragging"); };
svg.addEventListener("pointerup", endPointer); svg.addEventListener("pointercancel", endPointer);

document.getElementById("btn-in").onclick = () => zoomAt(0.7);
document.getElementById("btn-out").onclick = () => zoomAt(1 / 0.7);
document.getElementById("btn-fit").onclick = () => { const v = { ...view }; fit(); const t = { ...view }; view = v; flyTo(t.x + t.w / 2, t.y + t.h / 2, t.w); };

/* =========================================================
   PANEL
   ========================================================= */
const panel = document.getElementById("panel"), body = document.getElementById("panel-body"), eyebrow = document.getElementById("panel-eyebrow");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ext = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>`;

function setActive(id) {
  document.querySelectorAll(".node.active").forEach(n => n.classList.remove("active"));
  const lit = new Set();
  if (id && nodeEls[id]) {
    nodeEls[id].classList.add("active"); lit.add(id);
    const l = links[id]; [...l.to, ...l.from, ...l.with].forEach(x => lit.add(x));
  }
  edgeEls.forEach(e => e.el.classList.toggle("dim", !!id && !(e.a === id || e.b === id)));
}
function nodeButton(id) {
  const n = nodeById[id], r = realmById[n.realm];
  return `<li><button data-go="${id}"><span>${esc(n.name)}</span><span class="meta">${esc(r ? r.name : "")}</span></button></li>`;
}
function openPanel(html, eb, hash) {
  eyebrow.textContent = eb; body.innerHTML = html; body.scrollTop = 0;
  panel.classList.add("open");
  body.querySelectorAll("[data-go]").forEach(b => b.onclick = () => focusNode(b.dataset.go));
  body.querySelectorAll("[data-realm-go]").forEach(b => b.onclick = () => showRealm(b.dataset.realmGo, true));
  if (hash !== undefined) { try { history.replaceState(null, "", hash ? "#" + hash : location.pathname + location.search); } catch (e) {} }
}
function closePanel() {
  panel.classList.remove("open"); setActive(null);
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
}
document.getElementById("panel-close").onclick = closePanel;
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

function showNode(id) {
  const n = nodeById[id]; if (!n) return;
  const r = realmById[n.realm], k = KINDS[n.kind];
  const status = TRACKER[n.trackerRealm || n.realm];
  const l = links[id];
  let h = `<h2>${esc(n.name)}</h2><div class="chips"><span class="chip kind">${k.label}</span>`;
  if (status) h += `<span class="chip done">Realm ${status.toLowerCase()}</span>`;
  h += `</div>`;
  if (n.blurb) h += `<p>${esc(n.blurb)}</p>`;
  if (n.pdf) h += `<a class="btn primary cta" href="${drive(n.pdf)}" target="_blank" rel="noopener">Open mission brief ${ext}</a>`;
  else if (n.kind !== "gate" && n.kind !== "camp") h += `<p class="none">No mission brief is linked for this one in the Game Tracker.</p>`;
  if (n.extra) h += `<ul class="linklist"><li><a href="${drive(n.extra.id)}" target="_blank" rel="noopener"><span>${esc(n.extra.name)}</span>${ext}</a></li></ul>`;
  if (id.startsWith("sts-")) h += `<p class="none">This skirmish is fought in three places on the map: Stockton's Folly, the Drowned Nations and the Piscus Dimension. All three use the same brief.</p>`;
  if (l.from.size) h += `<div class="section-label">Reached from</div><ul class="linklist">${[...l.from].map(nodeButton).join("")}</ul>`;
  if (l.to.size) h += `<div class="section-label">Leads to</div><ul class="linklist">${[...l.to].map(nodeButton).join("")}</ul>`;
  if (l.with.size) h += `<div class="section-label">Connected with</div><ul class="linklist">${[...l.with].map(nodeButton).join("")}</ul>`;
  if (r) h += `<div class="section-label">Realm</div><ul class="linklist"><li><button data-realm-go="${r.id}"><span>${esc(r.name)}</span><span class="meta">Read lore</span></button></li></ul>`;
  openPanel(h, r ? r.name : "", id);
  setActive(id);
}
function showRealm(id, fly) {
  const r = realmById[id]; if (!r) return;
  let h = `<h2>${esc(r.name)}</h2><div class="chips"><span class="chip kind">Realm</span>`;
  if (TRACKER[id]) h += `<span class="chip done">${TRACKER[id]}</span>`;
  h += `</div>` + r.lore.map(p => `<p>${esc(p)}</p>`).join("");
  if (r.pack) h += `<a class="btn primary cta" href="${drive(r.pack)}" target="_blank" rel="noopener">Open ${esc(r.packName)} ${ext}</a>`;
  const ms = NODES.filter(n => (n.trackerRealm || n.realm) === id && n.kind !== "gate");
  if (ms.length) h += `<div class="section-label">Missions here</div><ul class="linklist">${ms.map(n => nodeButton(n.id)).join("")}</ul>`;
  h += `<p class="source">${r.note ? esc(r.note) + " " : ""}From <a href="${drive("1DrTJucBIF2r4TlsSbWQ2BhftdD2islzi")}" target="_blank" rel="noopener">Realms of Sumpton</a>.</p>`;
  openPanel(h, "Realm of Sumpton", "realm-" + id);
  setActive(null);
  if (fly && r.cx !== undefined) flyTo(r.cx, r.cy, Math.max(900, (r.rx || r.r) * 4.2));
}
function focusNode(id) {
  const n = nodeById[id]; if (!n) return;
  flyTo(n.x + (innerWidth > 640 ? 180 : 0), n.y + (innerWidth > 640 ? 0 : 160), 1150);
  showNode(id);
}
function showIndex() {
  const groups = REALMS.map(r => ({ r, ms: NODES.filter(n => (n.trackerRealm || n.realm) === r.id && n.kind !== "gate" && n.kind !== "camp") })).filter(g => g.ms.length);
  let h = `<h2>Mission Index</h2><label class="section-label" for="mission-search" style="display:block;border:0;margin:0">Find a mission</label>
    <input class="search" id="mission-search" type="search" placeholder="Type a mission name" autocomplete="off">
    <div id="index-list">` +
    groups.map(g => `<div class="realm-group" data-group><h3>${esc(g.r.name)}</h3><ul class="linklist">${g.ms.map(n =>
      `<li data-name="${esc(n.name.toLowerCase())}"><button data-go="${n.id}"><span>${esc(n.name)}</span><span class="meta">${n.pdf ? "Brief" : "No brief"}</span></button></li>`).join("")}</ul></div>`).join("") +
    `</div><div class="section-label">Packs and references</div><ul class="linklist">` +
    RESOURCES.map(x => `<li><a href="${drive(x.id)}" target="_blank" rel="noopener"><span>${esc(x.name)}</span><span class="meta">${esc(x.note)}</span></a></li>`).join("") +
    `</ul><p class="source">Mission and pack links come from the Game Tracker sheet.</p>`;
  openPanel(h, "Sumpton", "index");
  setActive(null);
  const s = document.getElementById("mission-search");
  s.oninput = () => {
    const q = s.value.trim().toLowerCase();
    body.querySelectorAll("[data-group]").forEach(g => {
      let any = false;
      g.querySelectorAll("li").forEach(li => { const on = !q || li.dataset.name.includes(q); li.hidden = !on; any = any || on; });
      g.hidden = !any;
    });
  };
}
document.getElementById("btn-index").onclick = showIndex;

/* clicks on the map: ignore if it was a drag */
svg.addEventListener("click", e => {
  if (dragMoved > 6) return;
  const node = e.target.closest("[data-node]"); if (node) { showNode(node.dataset.node); return; }
  const realm = e.target.closest("[data-realm]"); if (realm) { showRealm(realm.dataset.realm, false); return; }
});
svg.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const node = e.target.closest("[data-node]"); const realm = e.target.closest("[data-realm]");
  if (node) { e.preventDefault(); focusNode(node.dataset.node); }
  else if (realm) { e.preventDefault(); showRealm(realm.dataset.realm, true); }
});

/* hash routing: #mission-id, #realm-id, #index */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return;
  if (h === "index") showIndex();
  else if (h.startsWith("realm-")) showRealm(h.slice(6), true);
  else if (nodeById[h]) focusNode(h);
}
addEventListener("hashchange", route);
addEventListener("resize", () => { const c = { x: view.x + view.w / 2, y: view.y + view.h / 2 }, w = view.w; const a = aspect(); view = { x: c.x - w / 2, y: c.y - w / a / 2, w, h: w / a }; apply(); });

fit(); route();
})();
</script>
